# Every pull request and push to main: the documents' links resolve, and nothing private is in them (the
# organization's profile and the default community files every repository without its own shows). The last
# job, ci, is the one check the ruleset requires.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: overpressure/overpressure
          path: .overpressure
      - name: Private data, in every commit
        run: python3 .overpressure/scripts/check-private.py --repo . --history

  ci:
    needs: [links, private]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          [ -z "$bad" ] || { echo "::error::not passed: $bad"; exit 1; }
